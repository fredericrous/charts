replicaCount: 1
workerReplicaCount: 1

image:
  repository: ghcr.io/fredericrous/ticket-vision
  tag: latest
  pullPolicy: IfNotPresent

web:
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

# Documents the keys expected in the externally-managed `<release>-env`
# secret (the deployments consume it via envFrom; templates do not render
# this block).
env:
  SESSION_SECRET: ""
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URI: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local.:4318"
  KNATIVE_BROKER_URL: ""
  # Optional: cluster-vision CI resolver used to auto-link alert tickets to
  # configuration items. Defaults in-app to the in-cluster service URL below;
  # set only to override.
  # CLUSTER_VISION_URL: "http://cluster-vision.cluster-vision.svc.cluster.local:8080"

ingress:
  enabled: false
  className: ""
  host: ticket-vision.daddyshome.fr
  tls: false

knative:
  broker:
    enabled: false
    name: ticket-vision
