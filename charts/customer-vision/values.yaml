replicaCount: 1
workerReplicaCount: 1

image:
  repository: ghcr.io/fredericrous/customer-vision
  tag: latest
  pullPolicy: IfNotPresent

web:
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

env:
  SESSION_SECRET: ""
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URI: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local.:4318"
  GTM_BASE_URL: "http://gtm-agent.gtm-agent.svc.cluster.local:8080"
  JMAP_BASE_URL: "http://stalwart.stalwart.svc.cluster.local:8080"

ingress:
  enabled: false
  className: ""
  host: crm.daddyshome.fr
  tls: false
